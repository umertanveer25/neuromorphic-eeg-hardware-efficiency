name: Neuromorphic EEG Hardware CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch snntorch numpy scipy scikit-learn PyWavelets matplotlib seaborn
    - name: Run SNN Hardware Profiler Simulation
      run: |
        python src/snn_hardware_sim.py
    - name: Run Multi-Model Hardware Energy Benchmark
      run: |
        python src/multi_model_hardware_profiler.py
    - name: Test Feature Extraction Engine
      run: |
        python src/feature_extraction.py
